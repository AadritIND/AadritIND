<linearGradient id="planeMain" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#efffb8"/><stop offset="0.5" stop-color="#d7ff61"/><stop offset="1" stop-color="#9cbc32"/></linearGradient>
<linearGradient id="planeFold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d7ff61"/><stop offset="1" stop-color="#9cbc32"/></linearGradient>
<filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/></filter>
<filter id="iconShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="3" dy="9" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/></filter>
<filter id="tinyBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
<clipPath id="clip0"><rect width="390" height="256" rx="30"/></clipPath>
<clipPath id="clip1"><rect width="390" height="256" rx="30"/></clipPath>
<clipPath id="clip2"><rect width="390" height="256" rx="30"/></clipPath>
