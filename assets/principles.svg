<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="340" viewBox="0 0 1400 340" fill="none" role="img" aria-label="How Aadrit works — build, break, ship. Three floating glass cards with 3D cube, cracked shield and paper-plane icons.">
<title>How Aadrit works — build, break, ship. Three floating glass cards with 3D cube, cracked shield and paper-plane icons.</title>
<defs>
<radialGradient id="trayGlow" cx="0.5" cy="0.5" r="0.65"><stop offset="0" stop-color="#a98cff" stop-opacity="0.2"/><stop offset="0.6" stop-color="#a98cff" stop-opacity="0.05"/><stop offset="1" stop-color="#a98cff" stop-opacity="0"/></radialGradient>
<linearGradient id="cardBuild" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#191224" stop-opacity="0.98"/><stop offset="1" stop-color="#a98cff" stop-opacity="0.26"/></linearGradient>
<linearGradient id="cardBreak" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#191224" stop-opacity="0.98"/><stop offset="1" stop-color="#ff8d75" stop-opacity="0.2"/></linearGradient>
<linearGradient id="cardShip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#191224" stop-opacity="0.98"/><stop offset="1" stop-color="#d7ff61" stop-opacity="0.2"/></linearGradient>
<linearGradient id="cubeTop" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#e2d7ff"/><stop offset="1" stop-color="#a98cff"/></linearGradient>
<linearGradient id="cubeLeft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b63ff"/><stop offset="1" stop-color="#4a34a9"/></linearGradient>
<linearGradient id="cubeRight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a98cff"/><stop offset="1" stop-color="#7b63ff"/></linearGradient>
